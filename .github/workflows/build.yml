name: build

# The Kylin base image ghcr.io/<owner>/kylin:10.1-sp1-hwe-2303 is NOT built
# in CI — it is extracted from the official install media's squashfs
# (scripts/extract-base.sh) and pushed from a local machine. It exists only
# as the CI build vehicle; the deliverable is a .deb.
#
# CI: pull base -> fetch upstream at the pinned commit -> apply patches ->
# build engine + shim -> assemble deb -> upload artifact. GitHub Releases
# are not wired up yet; every run only produces a build artifact.

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # base (3.5G) + build layers can approach the default disk ceiling on
      # ubuntu-latest; clear the big preinstalled items first
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/lib/android || true
          sudo docker image prune -af || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      # The base image may be private; GITHUB_TOKEN can pull it within the
      # same owner account.
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.1.0-dev+$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build deb (with unit tests inside the container)
        run: |
          docker buildx build \
            --target test-result \
            --output type=local,dest=out-tests \
            --build-arg DEB_VERSION="${{ steps.ver.outputs.version }}" \
            .
          docker buildx build \
            --target export \
            --output type=local,dest=out \
            --build-arg DEB_VERSION="${{ steps.ver.outputs.version }}" \
            .
          # the test target writes a marker file only when ctest passed
          test -f out-tests/TESTS_PASSED || { echo "unit tests failed"; exit 1; }
          cat out-tests/TESTS_PASSED

      - name: Smoke test
        run: |
          ls -la out/
          dpkg-deb --info out/pkg.deb | head -12

      - name: Upload artifact (every run)
        uses: actions/upload-artifact@v4
        with:
          name: "wallpaper-engine-kylin_${{ steps.ver.outputs.version }}_amd64"
          path: out/pkg.deb
          if-no-files-found: error

