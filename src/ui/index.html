<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wallpaper Engine</title>
<link rel="icon" type="image/png" href="/icon.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="titlebar">
  <div class="title">Wallpaper Engine <span class="muted">for Kylin</span></div>
  <div class="status"><span class="dot" id="status-dot"></span><span id="status-text">Connecting…</span></div>
</header>

<nav class="toolbar">
  <div class="tabs">
    <button class="tab active" data-tab="installed">Installed</button>
    <button class="tab" data-tab="displays">Displays</button>
    <button class="tab" data-tab="settings">Settings</button>
  </div>
  <div class="tools">
    <button class="btn" id="btn-integration">Desktop integration</button>
  </div>
</nav>

<main>
  <section class="content">

    <div class="filterbar">
      <div class="search">
        <input id="search" type="search" placeholder="Search" autocomplete="off">
      </div>
      <button class="btn" id="btn-random">Random</button>
      <div class="spacer"></div>
      <label class="sort">Sort
        <select id="sort">
          <option value="name">Name</option>
          <option value="size">Size</option>
          <option value="type">Type</option>
        </select>
      </label>
    </div>

    <div class="panel" id="panel-installed">
      <div class="grid" id="grid"></div>
      <p class="empty" id="grid-empty" hidden></p>
    </div>

    <div class="panel" id="panel-displays" hidden>
      <div class="rows" id="display-rows"></div>
    </div>

    <div class="panel" id="panel-settings" hidden>
      <form class="settings" id="settings-form">
        <div class="field"><label>Engine path</label><input name="enginePath" type="text"></div>
        <div class="field"><label>Assets directory</label><input name="assetsDir" type="text"></div>
        <div class="field"><label>Workshop directory</label><input name="workshopDir" type="text"></div>
        <div class="field"><label>Frame rate</label><input name="fps" type="number" min="1" max="240"></div>
        <div class="field"><label>Volume</label><input name="volume" type="number" min="0" max="100"></div>
        <div class="field"><label>Scaling</label>
          <select name="scaling">
            <option value="fill">fill</option>
            <option value="fit">fit</option>
            <option value="stretch">stretch</option>
            <option value="default">default</option>
          </select>
        </div>
        <div class="field"><label>Clamp</label>
          <select name="clamp">
            <option value="border">border</option>
            <option value="repeat">repeat</option>
            <option value="mirror">mirror</option>
            <option value="default">default</option>
          </select>
        </div>
        <div class="checks">
          <label><input name="silent" type="checkbox"> Silent</label>
          <label><input name="fullscreenPause" type="checkbox"> Pause on fullscreen</label>
          <label><input name="automute" type="checkbox"> Mute while other apps play audio</label>
          <label><input name="disableParticles" type="checkbox"> Disable particles</label>
          <label><input name="disableMouse" type="checkbox"> Disable mouse input</label>
          <label><input name="disableParallax" type="checkbox"> Disable parallax</label>
        </div>
        <div class="actions">
          <button class="btn primary" type="submit">Save and restart engine</button>
        </div>
      </form>
    </div>

  </section>

  <aside class="detail" id="detail">
    <div class="preview" id="preview">
      <img id="preview-img" alt="" hidden>
      <video id="preview-video" muted loop playsinline hidden></video>
      <div class="preview-empty" id="preview-empty">Select a wallpaper</div>
      <button class="play" id="btn-apply" title="Apply" hidden>▶</button>
    </div>

    <h1 class="detail-title" id="detail-title">Nothing selected</h1>
    <div class="detail-meta" id="detail-meta"></div>
    <div class="detail-tags" id="detail-tags"></div>

    <div class="detail-actions">
      <button class="btn primary block" id="btn-apply-2" disabled>Apply to desktop</button>
      <button class="btn danger block" id="btn-stop">Stop wallpaper</button>
    </div>

    <div class="section">Properties</div>
    <div class="properties" id="properties">
      <button class="btn block" id="btn-properties" disabled>Load engine properties</button>
    </div>

    <div class="section">Desktop integration</div>
    <div class="integration" id="integration">Checking…</div>

    <div class="section">Screens</div>
    <div class="screens" id="screens"></div>
  </aside>
</main>

<footer class="bottombar">
  <span class="muted" id="footer-info"></span>
  <div class="spacer"></div>
  <button class="btn danger" id="btn-quit">Quit</button>
</footer>

<div class="toast" id="toast" hidden></div>

<script src="/app.js"></script>
</body>
</html>
